<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ForenSight AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ForenSight AI
        </div>

        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Cases</a>
            <a href="#">Evidence</a>
            <a href="#">Reports</a>
        </div>

    </nav>


    <main class="container">

        <section class="hero">

            <h1>Forensic CCTV Analysis</h1>

            <p>
                Upload CCTV footage and analyze it using
                AI-powered forensic tools.
            </p>

        </section>


        <section class="upload-card">

            <h2>Upload CCTV Footage</h2>

            <p class="description">
                Select a CCTV video file to begin analysis.
            </p>

            <div class="upload-area">

                <input
                    type="file"
                    id="videoInput"
                    accept="video/*"
                >

                <label for="videoInput">
                    Choose CCTV Video
                </label>

                <p id="fileName">
                    No file selected
                </p>

            </div>


            <button
                id="uploadButton"
                onclick="uploadVideo()">

                Upload & Analyze

            </button>


            <div
                id="status"
                class="status">
            </div>

        </section>


        <section
            id="result"
            class="result-card hidden">

            <h2>Upload Result</h2>

            <div id="resultContent"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
